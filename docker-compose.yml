name: licenckezelo

x-app-env: &app-env
  DATABASE_URL: postgres://${POSTGRES_USER:-licenckezelo}:${POSTGRES_PASSWORD:-licenckezelo}@db:5432/${POSTGRES_DB:-licenckezelo}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env (see .env.example)}
  BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
  APP_URL: ${APP_URL:-http://localhost:3000}
  LOG_LEVEL: ${LOG_LEVEL:-info}

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-licenckezelo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-licenckezelo}
      POSTGRES_DB: ${POSTGRES_DB:-licenckezelo}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    image: licenckezelo:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment: *app-env
    ports:
      - '${APP_PORT:-3000}:3000'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    image: licenckezelo:latest
    restart: unless-stopped
    command: ['pnpm', 'worker']
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started
    environment: *app-env

volumes:
  db-data:
